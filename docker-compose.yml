services:

  database:
    container_name: url_shortener_db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5433:5432
    volumes:
      - url_shortener_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5



  writer-service:
    build:
      context: .
      dockerfile: Dockerfile.writer
    ports:
      - 8000:8000
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy

  reader-service:
    build:
      context: .
      dockerfile: Dockerfile.reader
    ports:
      - 8001:8000
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy


volumes:
  url_shortener_postgres_data: