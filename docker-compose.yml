services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local_kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka


  cassandra-node1:
    image: cassandra:4.1
    container_name: cassandra-node1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      CASSANDRA_ENDPOINT_SNITCH: ${CASSANDRA_SNTCH}
      CASSANDRA_DC: ${CASSANDRA_DC}
    volumes:
      - cassandra_data1:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 10

  cassandra-node2:
    image: cassandra:4.1
    container_name: cassandra-node2
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      CASSANDRA_ENDPOINT_SNITCH: ${CASSANDRA_SNTCH}
      CASSANDRA_DC: ${CASSANDRA_DC}
      CASSANDRA_SEEDS: ${CASSANDRA_SEEDS}
    depends_on:
      cassandra-node1:
          condition: service_healthy
    volumes:
      - cassandra_data2:/var/lib/cassandra

  writer-service:
    build:
      context: .
      dockerfile: Dockerfile.writer
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      cassandra-node1:
        condition: service_healthy

  reader-service:
    build:
      context: .
      dockerfile: Dockerfile.reader
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      cassandra-node1:
        condition: service_healthy

  cleaner-service:
    build:
      context: .
      dockerfile: Dockerfile.cleaner
    env_file:
      - .env
    depends_on:
      cassandra-node1:
        condition: service_healthy


volumes:
  cassandra_data1:
  cassandra_data2:

